            <div style="font-size:36px; font-weight:900; margin-top:8px; color:#fef3c7; letter-spacing:-0.5px;">${formatMoney(salary.total)}</div>
            <div style="margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <span class="badge ${statusInfo.cls}" style="font-size: 11px;">${statusInfo.label}</span>
                ${st.paid > 0 ? `<span style="font-size: 12px; opacity: 0.9;">To'langan: ${formatMoney(st.paid)}</span>` : ''}
                ${st.debt > 0 ? `<span style="font-size: 12px; color: #fca5a5; font-weight: 700;">Qarz: ${formatMoney(st.debt)}</span>` : ''}
            </div>
            ${teacher.salary_type === 'percentage' && salary.details.length > 0 ? ` 
                <div style="font-size: 12px; opacity: 0.9; margin-top: 8px;">${salary.details.length} ta to'lovdan ${teacher.salary_percentage}% ulush</div>
            ` : ''}
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
            <div style="padding: 14px; background: var(--light); border-radius: 12px; text-align: center;">
                <div style="font-size: 22px; font-weight: 900; color: var(--primary-dark);">${groups.length}</div>
                <div style="font-size: 11px; color: var(--gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px;">Guruhlar</div>
            </div>
            <div style="padding: 14px; background: var(--light); border-radius: 12px; text-align: center;">
                <div style="font-size: 22px; font-weight: 900; color: var(--primary-dark);">${students.length}</div>
                <div style="font-size: 11px; color: var(--gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px;">O'quvchilar</div>
            </div>
        </div>
        
        ${detailsHTML}
        
        <div style="margin-top: 20px;">
            <button class="btn ${st.status === 'paid' ? 'btn-secondary' : 'btn-warning'}" style="width: 100%;" onclick="closeModal(); setTimeout(() => openTeacherSalaryPaymentModal(${teacherId}, '${month}'), 100);">
                <svg class="icon-sm"><use href="#i-credit-card"/></svg> 
                ${st.status === 'paid' ? 'To\'langan (o\'zgartirish)' : st.status === 'partial' ? `Qolganini berish (${formatMoney(st.debt)})` : `Oylik berish (${formatMoney(st.debt)})`}
            </button>
        </div>
    `;
}

/* ==================== O'QITUVCHIGA OYLIK BERISH ==================== */
function openTeacherSalaryPaymentModal(teacherId, month) {
    const teacher = DB.get('teachers').find(t => t.id === teacherId);
    if (!teacher) { toast('Xatolik', 'O\'qituvchi topilmadi', 'error'); return; }
    
    const salary = calculateTeacherSalary(teacherId, month);
    const st = getTeacherSalaryPaymentStatus(teacherId, month);
    const existingPayment = getTeacherSalaryPayment(teacherId, month);
    
    const remaining = st.debt;
    const paid = st.paid;
    
    const body = `
        <div style="display:flex; gap:14px; align-items:center; padding:16px; background:linear-gradient(135deg, var(--primary-50), white); border-radius:14px; margin-bottom:18px; border:1px solid var(--primary-light);">
            ${teacher.photo ? `<div class="profile-avatar" style="width:60px;height:60px;border-radius:16px;"><img src="${teacher.photo}"></div>` : `<div class="profile-avatar" style="width:60px;height:60px;border-radius:16px;font-size:24px;">${teacher.full_name.charAt(0)}</div>`}
            <div style="flex:1;">
                <h3 style="font-size:17px; font-weight:800; color:var(--dark); margin-bottom:3px;">${teacher.full_name}</h3>
                <p style="font-size:12px; color:var(--gray); margin-bottom:6px;">${getSubjectName(teacher.subject_id)} • ${formatMonth(month)}</p>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <span class="badge badge-info">Hisoblangan: ${formatMoney(salary.total)}</span>
                    ${paid > 0 ? `<span class="badge badge-success">To'langan: ${formatMoney(paid)}</span>` : ''}
                    ${remaining > 0 ? `<span class="badge badge-danger">Qoldiq: ${formatMoney(remaining)}</span>` : '<span class="badge badge-success">To\'liq to\'langan</span>'}
                </div>
            </div>
        </div>
        
        <div style="background: var(--info-light); border: 1px solid var(--info); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;">
            <div style="display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:#1e40af; font-weight:600; line-height:1.5;">
                <svg style="width:16px;height:16px;flex-shrink:0;margin-top:2px;"><use href="#i-info"/></svg>
                <span><strong>Oylik berish:</strong> Bu oy uchun o'qituvchiga beriladigan summani kiriting. To'liq yoki qisman berishingiz mumkin.</span>
            </div>
        </div>
        
        <div class="form-group">
            <label>To'lanadigan summa (so'm) *</label>
            <div style="display:flex; gap:8px;">
                <input type="number" id="sp_amount" value="${remaining > 0 ? remaining : 0}" min="0" step="1000" style="flex:1; padding:13px 16px; border:2px solid var(--border); border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; outline:none; color:var(--dark);">
                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('sp_amount').value=${remaining}" style="white-space:nowrap;">To'liq</button>
            </div>
            <div style="font-size:11.5px; color:var(--gray); margin-top:6px; font-weight:600;">
                Maksimal: <strong style="color:var(--primary-dark);">${formatMoney(remaining)}</strong> • Hisoblangan: <strong>${formatMoney(salary.total)}</strong>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>To'lov sanasi</label>
                <input type="date" id="sp_date" value="${new Date().toISOString().split('T')[0]}">
            </div>
            <div class="form-group">
                <label>To'lov usuli</label>
                <select id="sp_method">
                    <option>Naqd</option>
                    <option>Karta</option>
                    <option>Bank o'tkazmasi</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>Izoh (ixtiyoriy)</label>
            <input type="text" id="sp_notes" value="${existingPayment?.notes || ''}" placeholder="Masalan: oylik to'liq berildi...">
        </div>
        
        ${existingPayment && existingPayment.paid_amount > 0 ? `
            <div style="background: var(--warning-light); border: 1px solid var(--warning); border-radius: 12px; padding: 14px; margin-top: 10px;">
                <strong style="color:#92400e; font-size:12.5px; display:flex; align-items:center; gap:6px;">
                    <svg style="width:14px;height:14px;"><use href="#i-alert"/></svg>
                    Diqqat: oldin ${formatMoney(existingPayment.paid_amount)} to'langan
                </strong>
                <p style="font-size:11.5px; color:#92400e; margin-top:4px;">Yangi kiritgan summangiz avvalgi to'lovga <strong>qo'shiladi</strong>.</p>
            </div>
        ` : ''}
    `;
    
    window._modalSave = async () => {
        const amount = parseFloat(document.getElementById('sp_amount').value) || 0;
        const date = document.getElementById('sp_date').value;
        const method = document.getElementById('sp_method').value;
        const notes = document.getElementById('sp_notes').value || null;
        
        if (amount <= 0) { toast('Xatolik', 'Summani kiriting', 'error'); return; }
        if (amount > remaining && remaining > 0) { 
            toast('Xatolik', `Maksimal ${formatMoney(remaining)} kiritish mumkin`, 'error'); 
            return; 
        }
        
        try {
            if (existingPayment) {
                const newPaid = (parseFloat(existingPayment.paid_amount) || 0) + amount;
                const expected = salary.total;
                const newStatus = newPaid >= expected ? 'To\'langan' : 'Qisman to\'langan';
                await DB.update('salary_payments', existingPayment.id, {
                    paid_amount: newPaid,
                    payment_date: date,
                    payment_method: method,
                    status: newStatus,
                    notes
                });
            } else {
                const status = amount >= salary.total ? 'To\'langan' : 'Qisman to\'langan';
                await DB.insert('salary_payments', {
                    teacher_id: teacherId,
                    month,
                    expected_amount: salary.total,
                    paid_amount: amount,
                    payment_date: date,
                    payment_method: method,
                    status,
                    notes
                });
            }
            toast('Muvaffaqiyat', `${teacher.full_name} ga ${formatMoney(amount)} oylik berildi ✅`);
            closeModal();
            renderSalaries();
            renderDashboard();
        } catch (err) { toast('Xatolik', err.message, 'error'); }
    };
    
    openModal(
        `<svg class="icon" style="color:var(--warning)"><use href="#i-credit-card"/></svg> Oylik berish — ${formatMonth(month)}`,
        body,
        `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
         <button class="btn btn-primary" onclick="saveModal()"><svg class="icon-sm"><use href="#i-check-circle"/></svg> Oylik berish</button>`
    );
}

/* ==================== SALARIES (oy tanlash bilan) ==================== */
function renderSalaries() {
    const monthPicker = document.getElementById('salaryMonthPicker');
    if (monthPicker && !monthPicker.value) {
        monthPicker.value = _selectedSalaryMonth;
    }
    const selectedMonth = monthPicker ? monthPicker.value : _selectedSalaryMonth;
    _selectedSalaryMonth = selectedMonth;
    
    const teachers = DB.get('teachers').filter(t => t.status === 'Faol');
    
    let totalFixed = 0, totalPercentage = 0, totalPerLesson = 0;
    let totalExpected = 0, totalPaid = 0, totalDebt = 0;
    
    teachers.forEach(t => {
        const sal = calculateTeacherSalary(t.id, selectedMonth);
        if (t.salary_type === 'fixed') totalFixed += sal.total;
        else if (t.salary_type === 'percentage') totalPercentage += sal.total;
        else totalPerLesson += sal.total;
        totalExpected += sal.total;
        
        const st = getTeacherSalaryPaymentStatus(t.id, selectedMonth);
        totalPaid += st.paid;
        totalDebt += st.debt;
    });
    
    const isCurrentMonth = selectedMonth === new Date().toISOString().slice(0, 7);
    const monthBadge = isCurrentMonth ? 'Joriy oy' : 'O\'tgan oy';
    
    document.getElementById('salaryStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon"><svg><use href="#i-dollar"/></svg></div><div class="stat-label">${formatMonth(selectedMonth)} — Hisoblangan</div><div class="stat-value counter" data-target="${totalExpected}">0</div><div class="stat-change ${isCurrentMonth ? 'up' : 'down'}">${monthBadge} • ${teachers.length} o'qituvchi</div></div>
        <div class="stat-card blue"><div class="stat-icon"><svg><use href="#i-lock"/></svg></div><div class="stat-label">Belgilangan</div><div class="stat-value counter" data-target="${totalFixed}">0</div></div>
        <div class="stat-card purple"><div class="stat-icon"><svg><use href="#i-percent"/></svg></div><div class="stat-label">Foizli ulush</div><div class="stat-value counter" data-target="${totalPercentage}">0</div></div>
        <div class="stat-card orange"><div class="stat-icon"><svg><use href="#i-check-circle"/></svg></div><div class="stat-label">To'langan</div><div class="stat-value counter" data-target="${totalPaid}">0</div></div>
        <div class="stat-card red"><div class="stat-icon"><svg><use href="#i-alert"/></svg></div><div class="stat-label">Qarz (berilmagan)</div><div class="stat-value counter" data-target="${totalDebt}">0</div></div>
    `;
    document.querySelectorAll('#salaryStats .counter').forEach(el => animateCounter(el, parseInt(el.dataset.target) || 0));
    
    const tbody = document.getElementById('salariesTable');
    if (!teachers.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon-wrap"><svg><use href="#i-percent"/></svg></div><h3>Faol o\'qituvchilar yo\'q</h3></div></td></tr>';
        return;
    }
    
    tbody.innerHTML = teachers.map(t => {
        const sal = calculateTeacherSalary(t.id, selectedMonth);
        const groups = DB.get('groups').filter(g => g.teacher_id === t.id);
        const students = DB.get('students').filter(s => groups.some(g => g.id === s.group_id));
        const st = getTeacherSalaryPaymentStatus(t.id, selectedMonth);
        const statusInfo = formatSalaryStatus(st.status);
        
        let salaryTypeLabel = t.salary_type === 'fixed' ? 'Belgilangan' : t.salary_type === 'percentage' ? `Foizli (${t.salary_percentage}%)` : 'Dars uchun';
        const typeCls = t.salary_type === 'percentage' ? 'badge-purple' : t.salary_type === 'per_lesson' ? 'badge-warning' : 'badge-info';
        
        return `<tr>
            <td><div style="display:flex; align-items:center; gap:10px;">${getPhotoHTML(t.photo, t.full_name, 38)}<div><strong>${t.full_name}</strong><br><small style="color:var(--gray);">${t.phone || ''}</small></div></div></td>
            <td><span class="badge badge-info">${getSubjectName(t.subject_id)}</span></td>
            <td><span class="badge ${typeCls}">${salaryTypeLabel}</span></td>
            <td>${groups.length} ta</td>
            <td>${students.length} ta</td>
            <td><strong style="color:var(--primary-dark); font-size:15px;">${formatMoney(sal.total)}</strong></td>
            <td><span class="badge ${statusInfo.cls}">${statusInfo.label}</span>${st.paid > 0 && st.status !== 'paid' ? `<br><small style="color:var(--warning);font-weight:700;">${formatMoney(st.paid)} to'langan</small>` : ''}</td>
            <td>
                <button class="btn btn-sm btn-secondary btn-icon" onclick="viewTeacherSalary(${t.id}, '${selectedMonth}')" title="Tafsilot"><svg><use href="#i-eye"/></svg></button>
                <button class="btn btn-sm ${st.status === 'paid' ? 'btn-secondary' : 'btn-warning'} btn-icon" onclick="openTeacherSalaryPaymentModal(${t.id}, '${selectedMonth}')" title="${st.status === 'paid' ? 'To\'langan (tahrirlash)' : 'Oylik berish'}"><svg><use href="#i-credit-card"/></svg></button>
            </td>
        </tr>`;
    }).join('');
}

function onSalaryMonthChange(month) {
    _selectedSalaryMonth = month;
    renderSalaries();
}

function exportSalaries() {
    const selectedMonth = _selectedSalaryMonth;
    const teachers = DB.get('teachers').filter(t => t.status === 'Faol');
    let csv = `O'qituvchi,Fan,Maosh turi,Foiz,Guruhlar,O'quvchilar,Hisoblangan,To'langan,Qarz,Holati\n`;
    teachers.forEach(t => {
        const sal = calculateTeacherSalary(t.id, selectedMonth);
        const groups = DB.get('groups').filter(g => g.teacher_id === t.id);
        const students = DB.get('students').filter(s => groups.some(g => g.id === s.group_id));
        const st = getTeacherSalaryPaymentStatus(t.id, selectedMonth);
        const typeLabel = t.salary_type === 'fixed' ? 'Belgilangan' : t.salary_type === 'percentage' ? 'Foizli' : 'Dars uchun';
        csv += `"${t.full_name}","${getSubjectName(t.subject_id)}","${typeLabel}","${t.salary_percentage || 0}%",${groups.length},${students.length},${Math.round(sal.total)},${Math.round(st.paid)},${Math.round(st.debt)},"${formatSalaryStatus(st.status).label}"\n`;
    });
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `maoshlar_${selectedMonth}.csv`;
    link.click();
    toast('Muvaffaqiyat', `${formatMonth(selectedMonth)} maoshlari yuklab olindi`);
}

/* ==================== GROUPS ==================== */
function renderGroups() {
    const search = (document.getElementById('groupSearch').value || '').toLowerCase();
    let groups = DB.get('groups');
    if (search) groups = groups.filter(g => g.name.toLowerCase().includes(search));
    const students = DB.get('students');
    const tbody = document.getElementById('groupsTable');
    if (!groups.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="icon-wrap"><svg><use href="#i-users"/></svg></div><h3>Guruhlar yo\'q</h3></div></td></tr>'; return; }
    tbody.innerHTML = groups.map(g => {
        const count = students.filter(s => s.group_id === g.id).length;
        const pct = Math.round((count / (g.max_students || 15)) * 100);
        const cls = pct >= 90 ? 'danger' : pct >= 70 ? 'warning' : '';
        return `<tr>
            <td><strong>${g.name}</strong></td>
            <td><span class="badge badge-info">${getSubjectName(g.subject_id)}</span></td>
            <td>${getTeacherName(g.teacher_id)}</td>
            <td>${g.room || '-'}</td>
            <td><div style="max-width:340px;white-space:normal;font-size:12px;font-weight:600;">${getGroupDaysText(g)}</div></td>
            <td><div style="min-width:130px;"><strong>${count} / ${g.max_students}</strong><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div></div></td>
            <td>${formatMoney(g.monthly_payment)}</td>
            <td><span class="badge ${g.status === 'Faol' ? 'badge-success' : 'badge-gray'}">${g.status}</span></td>
            <td>
                <button class="btn btn-sm btn-secondary btn-icon" onclick="editGroup(${g.id})"><svg><use href="#i-edit"/></svg></button>
                <button class="btn btn-sm btn-danger btn-icon" onclick="deleteGroup(${g.id})"><svg><use href="#i-trash"/></svg></button>
            </td>
        </tr>`;
    }).join('');
}
function openGroupModal(id = null) {
    const subjects = DB.get('subjects'), teachers = DB.get('teachers');
    const g = id ? DB.get('groups').find(x => x.id === id) : {};
    const isEdit = !!id;
    const body = `
        <div class="form-row">
            <div class="form-group"><label>Guruh nomi *</label><input type="text" id="g_name" value="${g.name || ''}" required placeholder="IELTS-01"></div>
            <div class="form-group"><label>Fan</label><select id="g_subject_id">${subjects.length ? subjects.map(s => `<option value="${s.id}" ${g.subject_id == s.id ? 'selected' : ''}>${s.name}</option>`).join('') : '<option value="">Avval fan qo\'shing</option>'}</select></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>O'qituvchi</label><select id="g_teacher_id">${teachers.length ? teachers.map(t => `<option value="${t.id}" ${g.teacher_id == t.id ? 'selected' : ''}>${t.full_name}${t.salary_type === 'percentage' ? ` (${t.salary_percentage}%)` : ''}</option>`).join('') : '<option value="">Avval o\'qituvchi qo\'shing</option>'}</select></div>
            <div class="form-group"><label>Xona</label><input type="text" id="g_room" value="${g.room || ''}" placeholder="203"></div>
        </div>
        <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;"><svg class="icon-sm" style="color:var(--primary)"><use href="#i-calendar"/></svg> Dars kunlari va vaqtlari</label>
            <p style="font-size:12px;color:var(--gray);margin-bottom:10px;font-weight:500;">Har bir kun uchun boshlanish va tugash vaqtini belgilang.</p>
            ${buildDaysScheduleHTML(g.days)}
        </div>
        <div class="form-row">
            <div class="form-group"><label>Oylik to'lov (so'm)</label><input type="number" id="g_monthly_payment" value="${g.monthly_payment || 0}"></div>
            <div class="form-group"><label>Maks. o'quvchilar</label><input type="number" id="g_max_students" value="${g.max_students || 15}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Boshlanish sanasi</label><input type="date" id="g_start_date" value="${g.start_date || ''}"></div>
            <div class="form-group"><label>Status</label><select id="g_status"><option ${g.status === 'Faol' ? 'selected' : ''}>Faol</option><option ${g.status === 'Nofaol' ? 'selected' : ''}>Nofaol</option></select></div>
        </div>
    `;
    window._modalSave = async () => {
        const name = document.getElementById('g_name').value.trim();
        if (!name) { toast('Xatolik', 'Guruh nomi kiritilishi shart', 'error'); return; }
        const days = collectDaysFromForm();
        if (!days.length) { toast('Xatolik', 'Kamida bitta kun belgilang', 'error'); return; }
        const data = {
            name, subject_id: parseInt(document.getElementById('g_subject_id').value) || null,
            teacher_id: parseInt(document.getElementById('g_teacher_id').value) || null,
            room: document.getElementById('g_room').value || null, days,
            monthly_payment: parseFloat(document.getElementById('g_monthly_payment').value) || 0,
            max_students: parseInt(document.getElementById('g_max_students').value) || 15,
            start_date: document.getElementById('g_start_date').value || null,
            status: document.getElementById('g_status').value
        };
        try {
            if (isEdit) { await DB.update('groups', id, data); toast('Muvaffaqiyat', 'Yangilandi'); }
            else { await DB.insert('groups', data); toast('Muvaffaqiyat', 'Qo\'shildi'); }
            closeModal(); renderGroups();
        } catch (err) { toast('Xatolik', err.message, 'error'); }
    };
    openModal(`<svg class="icon"><use href="#i-users"/></svg> ${isEdit ? 'Tahrirlash' : 'Yangi guruh'}`, body);
    setTimeout(attachDaysListeners, 30);
}
function editGroup(id) { openGroupModal(id); }
async function deleteGroup(id) { if (!confirm('O\'chirishni xohlaysizmi?')) return; try { await DB.remove('groups', id); toast('Muvaffaqiyat', 'O\'chirildi'); renderGroups(); } catch (err) { toast('Xatolik', err.message, 'error'); } }

/* ==================== SUBJECTS ==================== */

function openSubjectModal(id = null) {
    const s = id ? DB.get('subjects').find(x => x.id === id) : {};
    const isEdit = !!id;
    const body = `
        <div class="form-group"><label>Fan nomi *</label><input type="text" id="sub_name" value="${s.name || ''}" required></div>
        <div class="form-group"><label>Tavsif</label><textarea id="sub_description" rows="3">${s.description || ''}</textarea></div>

function renderPayments() {
    const months = [...new Set(DB.get('payments').map(p => p.month))].sort().reverse();
    const mf = document.getElementById('paymentFilterMonth');
    if (!mf) return;
    const cv = mf.value;
    mf.innerHTML = '<option value="">Barcha oylar</option>' + months.map(m => `<option value="${m}">${formatMonth(m)}</option>`).join('');
    mf.value = cv;
    const search = (document.getElementById('paymentSearch').value || '').toLowerCase();
    const fs = document.getElementById('paymentFilterStatus').value;
    const fm = mf.value;
    let payments = DB.get('payments');
    if (search) payments = payments.filter(p => getStudentName(p.student_id).toLowerCase().includes(search));
    if (fs) payments = payments.filter(p => p.status === fs);
    if (fm) payments = payments.filter(p => p.month === fm);
    payments = [...payments].reverse().slice(0, 100);
    const tbody = document.getElementById('paymentsTable');
    if (!payments.length) { tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="icon-wrap"><svg><use href="#i-credit-card"/></svg></div><h3>To\'lovlar yo\'q</h3></div></td></tr>'; return; }
    tbody.innerHTML = payments.map(p => {
        const expected = parseFloat(p.expected_amount) || 0;
        const paid = parseFloat(p.paid_amount) || 0;
        const debt = expected - paid;
        const pct = expected > 0 ? Math.round((paid / expected) * 100) : 100;
        const cls = p.status === 'To\'langan' ? 'badge-success' : p.status === 'Qisman to\'langan' ? 'badge-warning' : 'badge-danger';
        const fillCls = pct >= 100 ? '' : pct >= 50 ? 'warning' : 'danger';
        return `<tr>
            <td><strong>${getStudentName(p.student_id)}</strong></td>
            <td>${formatMonth(p.month)}</td>
            <td>${formatMoney(expected)}</td>
            <td><strong style="color:var(--primary-dark);">${formatMoney(paid)}</strong></td>
            <td style="color:${debt > 0 ? 'var(--danger)' : 'var(--primary)'};font-weight:700;">${formatMoney(debt)}</td>
            <td><div style="min-width:100px;"><div style="font-size:11px; font-weight:800; color:${pct >= 100 ? 'var(--primary-dark)' : pct >= 50 ? 'var(--warning)' : 'var(--danger)'}; margin-bottom:3px;">${pct}%</div><div class="progress-bar" style="height:6px;"><div class="progress-fill ${fillCls}" style="width:${pct}%; height:6px;"></div></div></div></td>
            <td>${p.payment_date || '-'}</td>
            <td>${p.payment_method || '-'}</td>
            <td><span class="badge ${cls}">${p.status}</span></td>
            <td>
                <button class="btn btn-sm btn-warning btn-icon" onclick="openManualPaymentModal(${p.student_id})" title="Qo'lda to'lov"><svg><use href="#i-credit-card"/></svg></button>

async function saveAttendance() {
    const gid = document.getElementById('attendanceGroup').value;
    const date = document.getElementById('attendanceDate').value;
    if (!gid || !date) { toast('Xatolik', 'Guruh va sanani tanlang', 'error'); return; }
    const records = [];
    document.querySelectorAll('.att-status').forEach(sel => {
        const sid = parseInt(sel.dataset.student);
        const note = document.querySelector(`.att-note[data-student="${sid}"]`).value;
        records.push({ student_id: sid, group_id: parseInt(gid), date, status: sel.value, notes: note || null });
    });
    try {
        await window.supabaseClient.from('attendance').delete().eq('group_id', parseInt(gid)).eq('date', date);
        const { data } = await window.supabaseClient.from('attendance').insert(records).select();
        DB._cache.attendance = [...DB.get('attendance').filter(a => !(a.group_id == gid && a.date === date)), ...(data || [])];
        toast('Muvaffaqiyat', 'Davomat saqlandi');
        renderDashboard();
    } catch (err) { toast('Xatolik', err.message, 'error'); }
}

function renderReports() {

    const totalRec = payments.reduce((s, p) => s + parseFloat(p.paid_amount || 0), 0);

    const totalExpenses = expenses.reduce((s, e) => s + parseFloat(e.amount || 0), 0);
    const thisMonth = new Date().toISOString().slice(0, 7);
    let totalTeacherSalaries = 0;

        const sal = calculateTeacherSalary(t.id, thisMonth);
        totalTeacherSalaries += sal.total;
        const st = getTeacherSalaryPaymentStatus(t.id, thisMonth);
        totalSalaryDebt += st.debt;
    });
    const netProfit = totalRec - totalExpenses - totalTeacherSalaries;
    document.getElementById('reportStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon"><svg><use href="#i-target"/></svg></div><div class="stat-label">Kutilgan</div><div class="stat-value counter" data-target="${totalExp}">0</div></div>

        <div class="stat-card red"><div class="stat-icon"><svg><use href="#i-alert"/></svg></div><div class="stat-label">Qarz</div><div class="stat-value counter" data-target="${Math.max(0, totalDebt)}">0</div></div>
        <div class="stat-card purple"><div class="stat-icon"><svg><use href="#i-wallet"/></svg></div><div class="stat-label">Xarajat</div><div class="stat-value counter" data-target="${totalExpenses}">0</div></div>
        <div class="stat-card orange"><div class="stat-icon"><svg><use href="#i-percent"/></svg></div><div class="stat-label">Maoshlar (bu oy)</div><div class="stat-value counter" data-target="${totalTeacherSalaries}">0</div></div>
        <div class="stat-card red"><div class="stat-icon"><svg><use href="#i-alert"/></svg></div><div class="stat-label">Maosh qarzi</div><div class="stat-value counter" data-target="${totalSalaryDebt}">0</div></div>
        <div class="stat-card ${netProfit >= 0 ? '' : 'red'}"><div class="stat-icon"><svg><use href="#i-award"/></svg></div><div class="stat-label">Sof foyda</div><div class="stat-value counter" data-target="${netProfit}">0</div></div>
    `;
    document.querySelectorAll('#reportStats .counter').forEach(el => animateCounter(el, parseInt(el.dataset.target) || 0));
    setTimeout(() => {
        destroyCharts();
        const months = {};
        payments.forEach(p => { if (!months[p.month]) months[p.month] = { expected: 0, received: 0 }; months[p.month].expected += parseFloat(p.expected_amount || 0); months[p.month].received += parseFloat(p.paid_amount || 0); });
        const sm = Object.keys(months).sort().slice(-6);
        charts.repRev = new Chart(document.getElementById('chartReportRevenue'), {
            type: 'bar',
            data: { labels: sm.length ? sm.map(m => formatMonth(m)) : ['Ma\'lumot yo\'q'], datasets: [
                { label: 'Kutilgan', data: sm.length ? sm.map(m => months[m].expected) : [0], backgroundColor: 'rgba(16,185,129,0.2)', borderRadius: 8, barThickness: 28 },
                { label: 'Tushgan', data: sm.length ? sm.map(m => months[m].received) : [0], backgroundColor: 'rgba(16,185,129,1)', borderRadius: 8, barThickness: 28 }
            ]},
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
        });
        const expByCat = {};
        EXPENSE_CATEGORIES.forEach(c => expByCat[c] = 0);
        expenses.forEach(e => { const cat = e.category || 'Boshqa'; expByCat[cat] = (expByCat[cat] || 0) + parseFloat(e.amount || 0); });
        const catLabels = Object.keys(expByCat).filter(k => expByCat[k] > 0);
        const catColors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4'];
        charts.repExp = new Chart(document.getElementById('chartReportExpenses'), {
            type: 'doughnut',
            data: { labels: catLabels.length ? catLabels : ['Xarajat yo\'q'], datasets: [{ data: catLabels.length ? catLabels.map(k => expByCat[k]) : [1], backgroundColor: catLabels.length ? catLabels.map((_, i) => catColors[i % catColors.length]) : ['#e2e8f0'], borderWidth: 0, cutout: '65%' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }, 50);
}
function exportReport(type) {
    const payments = DB.get('payments');
    let csv = 'O\'quvchi,Oy,Kutilgan,To\'langan,Qarz,Holati\n';
    payments.forEach(p => { csv += `"${getStudentName(p.student_id)}",${p.month},${p.expected_amount},${p.paid_amount},${p.expected_amount - p.paid_amount},"${p.status}"\n`; });
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `bloom_hisobot_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    toast('Muvaffaqiyat', 'Excel yuklab olindi');
}

function renderNotifications() {

function navigateTeacher(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const pageEl = document.getElementById('page-' + page);
    if (pageEl) pageEl.classList.add('active');
    const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
    if (navEl) navEl.classList.add('active');
    const [title, subtitle] = teacherPageTitles[page] || ['Panel', ''];
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSubtitle').textContent = subtitle;
    if (window.innerWidth <= 768) closeSidebar();
    if (page === 'my-schedule') renderTeacherSchedule();
    if (page === 'my-today') renderTeacherTodayFull();

}

function renderTeacherSchedule() {
    const today = DAYS_MAP[new Date().getDay()];
    const dateStr = new Date().toLocaleDateString('uz-UZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('teacherHeroDate').textContent = dateStr;
    const schedules = getTeacherSchedules();
    const groups = getTeacherGroups();
    const todaySchedules = schedules.filter(s => s.day === today).sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
    const totalStudents = DB.get('students').filter(s => groups.some(g => g.id === s.group_id)).length;
    document.getElementById('teacherHeroStats').innerHTML = `
        <div class="hero-stat"><span class="num">${todaySchedules.length}</span><span class="lbl">Bugungi darslar</span></div>
        <div class="hero-stat"><span class="num">${schedules.length}</span><span class="lbl">Haftalik darslar</span></div>
        <div class="hero-stat"><span class="num">${groups.length}</span><span class="lbl">Guruhlar</span></div>
        <div class="hero-stat"><span class="num">${totalStudents}</span><span class="lbl">O'quvchilar</span></div>
    `;
    const badge = document.getElementById('todayLessonBadge');
    if (badge) badge.textContent = todaySchedules.length;
    const todayBadge = document.getElementById('todayBadge');
    if (todayBadge) todayBadge.textContent = `${todaySchedules.length} ta dars`;
    const todayList = document.getElementById('teacherTodayList');
    if (!todaySchedules.length) {
        todayList.innerHTML = `<div class="empty-state" style="padding:30px;"><div class="icon-wrap" style="width:60px;height:60px;"><svg style="width:28px;height:28px;"><use href="#i-check-circle"/></svg></div><h3>Bugun darsingiz yo'q</h3><p>${today} kuni dam oling! 😊</p></div>`;
    } else {
        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        todayList.innerHTML = todaySchedules.map((s, idx) => {
            const isNow = currentTime >= s.start_time && currentTime <= s.end_time;
            const isPast = currentTime > s.end_time;
            const nextIdx = todaySchedules.findIndex(x => x.start_time > currentTime);
            const isNext = !isNow && !isPast && idx === nextIdx;
            let statusBadge = '', borderColor = 'var(--primary)';
            if (isNow) { statusBadge = '<span class="badge badge-success">🟢 Hozir</span>'; borderColor = 'var(--primary)'; }
            else if (isPast) { statusBadge = '<span class="badge badge-gray">✓ Tugagan</span>'; borderColor = 'var(--gray-2)'; }
            else if (isNext) { statusBadge = '<span class="badge badge-warning">⏰ Keyingi</span>'; borderColor = 'var(--warning)'; }
            else { statusBadge = '<span class="badge badge-info">Rejalashtirilgan</span>'; }
            return `<div class="schedule-item" style="border-left-color: ${borderColor}; ${isNow ? 'background: var(--primary-50); box-shadow: 0 0 0 2px var(--primary);' : ''}">
                <div class="schedule-time">${s.start_time}<small>${s.end_time}</small></div>
                <div class="schedule-info">
                    <h4>${getSubjectName(s.subject_id)}</h4>
                    <p><svg><use href="#i-users"/></svg> ${getGroupName(s.group_id)} • <svg><use href="#i-home"/></svg> ${s.room || '-'} xona</p>
                </div>
                ${statusBadge}
            </div>`;
        }).join('');
    }
    const weekEl = document.getElementById('teacherWeekSchedule');
    if (!schedules.length) {
        weekEl.innerHTML = `<div class="empty-state"><div class="icon-wrap"><svg><use href="#i-calendar"/></svg></div><h3>Darslar yo'q</h3><p>Sizga hali darslar biriktirilmagan</p></div>`;
        return;
    }
    let html = '<div style="display:flex; flex-direction:column; gap:14px;">';
    DAYS.forEach(day => {
        const daySchedules = schedules.filter(s => s.day === day).sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
        const isToday = day === today;
        html += `<div style="border:2px solid ${isToday ? 'var(--primary)' : 'var(--border)'}; border-radius:14px; padding:14px 16px; ${isToday ? 'background: linear-gradient(135deg, var(--primary-50), white);' : 'background: white;'}">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:${daySchedules.length ? '12px' : '0'};">
                <strong style="font-size:14px; ${isToday ? 'color: var(--primary-dark);' : 'color: var(--dark);'}">${day}</strong>
                ${isToday ? '<span class="badge badge-success" style="font-size:10px;">Bugun</span>' : ''}
                ${daySchedules.length ? `<span class="badge badge-info" style="font-size:10px;">${daySchedules.length} ta</span>` : '<span class="badge badge-gray" style="font-size:10px;">Dars yo\'q</span>'}
            </div>
            ${daySchedules.map(s => `<div style="display:flex; align-items:center; gap:12px; padding:10px 12px; background: var(--light); border-radius:10px; margin-bottom:6px; border-left:3px solid var(--primary);">
                <div style="min-width:100px; font-weight:800; font-size:13px; color:var(--primary-dark);">${s.start_time} - ${s.end_time}</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:700; font-size:13px; color:var(--dark);">${getSubjectName(s.subject_id)}</div>
                    <div style="font-size:11px; color:var(--gray); margin-top:2px;">${getGroupName(s.group_id)} • ${s.room || '-'} xona</div>
                </div>
            </div>`).join('')}
        </div>`;
    });
    html += '</div>';
    weekEl.innerHTML = html;
}

                <p style="font-size:13px; color:var(--gray);"><svg style="width:14px;height:14px;vertical-align:middle;"><use href="#i-home"/></svg> ${s.room || '-'} xona</p>
                ${isNow ? '<span class="badge badge-success" style="margin-top:10px;">🟢 Hozir davom etmoqda</span>' : ''}
                ${isPast ? '<span class="badge badge-gray" style="margin-top:10px;">✓ Tugagan</span>' : ''}
            </div>
        </div>`;
    }).join('');
}

function renderTeacherGroups() {
    const groups = getTeacherGroups();
    const students = DB.get('students');
    const tbody = document.getElementById('teacherGroupsTable');
    if (!groups.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="icon-wrap"><svg><use href="#i-users"/></svg></div><h3>Guruhlar yo\'q</h3><p>Sizga hali guruhlar biriktirilmagan</p></div></td></tr>';
        return;
    }
    tbody.innerHTML = groups.map(g => {
        const count = students.filter(s => s.group_id === g.id).length;
        return `<tr>
            <td><strong>${g.name}</strong></td>
            <td><span class="badge badge-info">${getSubjectName(g.subject_id)}</span></td>
            <td>${g.room || '-'}</td>
            <td><div style="max-width:340px;white-space:normal;font-size:12px;font-weight:600;">${getGroupDaysText(g)}</div></td>
            <td><span class="badge badge-success">${count} ta</span></td>
        </tr>`;
    }).join('');
}

/* ==================== SEARCH ==================== */
document.getElementById('globalSearch')?.addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!q) return;
    const cur = document.querySelector('.page.active')?.id.replace('page-', '') || '';
    const map = { students: 'studentSearch', teachers: 'teacherSearch', groups: 'groupSearch', payments: 'paymentSearch', expenses: 'expenseSearch' };
    if (map[cur]) {
        document.getElementById(map[cur]).value = q;
        const renderMap = { students: renderStudents, teachers: renderTeachers, groups: renderGroups, payments: renderPayments, expenses: renderExpenses };
        renderMap[cur]();
    }
});

/* ==================== RENDER ALL ==================== */
function renderAll() {
    renderDashboard();
    renderStudents();
    renderTeachers();
    renderGroups();
    renderSubjects();
    renderPayments();
    renderExpenses();
    renderSalaries();
    renderSchedule();
    renderAttendance();
    renderReports();
    renderNotifications();
}

/* ==================== PWA ==================== */
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => document.getElementById('pwaInstallBtn').classList.add('show'), 3000);
});
async function installPWA() {
    if (!deferredPrompt) { toast('Ma\'lumot', 'Brauzer menyusidan "Install" ni tanlang', 'info'); return; }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') { toast('Muvaffaqiyat', 'Bloom Education o\'rnatildi! 🎉'); document.getElementById('pwaInstallBtn').classList.remove('show'); }
    deferredPrompt = null;
}
window.addEventListener('appinstalled', () => {
    toast('Muvaffaqiyat', 'Dastur o\'rnatildi! 🚀');
    document.getElementById('pwaInstallBtn').classList.remove('show');
});

window.addEventListener('online', () => document.getElementById('offlineIndicator').classList.remove('show'));
window.addEventListener('offline', () => document.getElementById('offlineIndicator').classList.add('show'));

console.log('%c✅ Oylik berish funksiyasi qo\'shildi', 'color: #059669; font-size: 13px;');
