<style>
:root {
    --primary: #10b981; --primary-dark: #059669; --primary-deep: #047857;
    --primary-light: #d1fae5; --primary-50: #ecfdf5; --primary-glow: rgba(16,185,129,0.35);
    --secondary: #065f46; --danger: #ef4444; --danger-light: #fee2e2;
    --warning: #f59e0b; --warning-light: #fef3c7;
    --info: #3b82f6; --info-light: #dbeafe;
    --purple: #8b5cf6; --purple-light: #ede9fe;
    --dark: #0f172a; --dark-2: #1e293b; --gray: #64748b; --gray-2: #94a3b8;
    --light: #f8fafc; --border: #e2e8f0; --white: #ffffff;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
    --shadow: 0 4px 12px -2px rgba(15,23,42,0.08), 0 2px 6px -1px rgba(15,23,42,0.04);
    --shadow-md: 0 10px 24px -4px rgba(15,23,42,0.12);
    --shadow-lg: 0 24px 48px -12px rgba(15,23,42,0.18);
    --shadow-glow: 0 8px 32px rgba(16,185,129,0.28);
    --radius: 14px; --radius-lg: 20px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--light); color: var(--dark); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }
.icon { width: 20px; height: 20px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
.bg-decoration { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: floatBlob 20s ease-in-out infinite; }
.bg-blob.b1 { width: 500px; height: 500px; background: var(--primary-light); top: -200px; left: -100px; }
.bg-blob.b2 { width: 400px; height: 400px; background: #dbeafe; bottom: -150px; right: -100px; animation-delay: -7s; }
.bg-blob.b3 { width: 350px; height: 350px; background: #ede9fe; top: 40%; left: 40%; animation-delay: -14s; }
@keyframes floatBlob { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(40px, -30px) scale(1.1); } 66% { transform: translate(-30px, 30px) scale(0.95); } }

/* LOGIN */
.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #064e3b 0%, #047857 40%, #10b981 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.login-screen.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
.login-screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 15% 25%, rgba(255,255,255,0.15) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(255,255,255,0.1) 0%, transparent 45%); animation: bgPulse 8s ease-in-out infinite; }
@keyframes bgPulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
.particles { position: absolute; inset: 0; overflow: hidden; }
.particle { position: absolute; width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; animation: floatUp linear infinite; }
@keyframes floatUp { from { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateY(-100px) scale(1); opacity: 0; } }
.login-box { background: rgba(255,255,255,0.98); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 48px 40px; border-radius: 24px; box-shadow: 0 32px 64px -16px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.2); width: 100%; max-width: 440px; position: relative; z-index: 1; animation: loginIn 0.7s var(--ease-bounce); }
@keyframes loginIn { 0% { opacity: 0; transform: translateY(40px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo-icon { width: 84px; height: 84px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; color: white; margin-bottom: 18px; box-shadow: 0 12px 32px var(--primary-glow), inset 0 0 0 1px rgba(255,255,255,0.2); animation: logoPulse 3s ease-in-out infinite; }
@keyframes logoPulse { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(-3deg); } }
.login-logo-icon svg { width: 46px; height: 46px; stroke: white; stroke-width: 1.8; fill: none; }
.login-logo h1 { font-size: 30px; font-weight: 900; color: var(--dark); letter-spacing: -1px; }
.login-logo h1 span { background: linear-gradient(135deg, var(--primary), var(--primary-deep)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.login-logo p { color: var(--gray); font-size: 14px; margin-top: 6px; font-weight: 500; }
.form-group { margin-bottom: 18px; position: relative; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--dark-2); margin-bottom: 8px; transition: color 0.2s; }
.form-group:focus-within label { color: var(--primary-dark); }
.input-wrap { position: relative; }
.input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray-2); transition: color 0.2s; pointer-events: none; width: 20px; height: 20px; }
.form-group:focus-within .input-icon { color: var(--primary); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 13px 16px 13px 44px; border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; font-weight: 500; transition: all 0.25s var(--ease); background: var(--white); color: var(--dark); outline: none; }
.form-group input:not(.with-icon), .form-group select:not(.with-icon), .form-group textarea:not(.with-icon) { padding-left: 16px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); transform: translateY(-1px); }
.form-group input::placeholder { color: var(--gray-2); font-weight: 400; }
.pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gray-2); padding: 6px; border-radius: 6px; display: flex; align-items: center; transition: all 0.2s; }
.pw-toggle:hover { color: var(--primary); background: var(--primary-50); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.25s var(--ease); text-decoration: none; white-space: nowrap; }
.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; width: 100%; padding: 15px; font-size: 15px; box-shadow: 0 8px 20px var(--primary-glow); letter-spacing: 0.2px; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px var(--primary-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary { background: var(--white); color: var(--dark-2); border: 2px solid var(--border); }
.btn-secondary:hover { background: var(--primary-50); border-color: var(--primary); color: var(--primary-dark); transform: translateY(-1px); }
.btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: white; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(239,68,68,0.4); }
.btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: white; box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
.btn-warning:hover { transform: translateY(-1px); }
.btn-sm { padding: 9px 16px; font-size: 13px; }
.btn-icon { width: 38px; height: 38px; padding: 0; border-radius: 10px; }
.btn-icon svg { width: 17px; height: 17px; }
.loader { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.shake { animation: shake 0.5s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.app { display: none; min-height: 100vh; position: relative; z-index: 1; }
.app.active { display: flex; animation: appIn 0.5s var(--ease); }
@keyframes appIn { from { opacity: 0; } to { opacity: 1; } }
.sidebar { width: 268px; background: linear-gradient(180deg, #ffffff 0%, #fafcfb 100%); border-right: 1px solid var(--border); height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; transition: transform 0.35s var(--ease); z-index: 1000; box-shadow: 2px 0 20px rgba(15,23,42,0.03); }
.sidebar-header { padding: 22px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; position: relative; }
.sidebar-header::after { content: ''; position: absolute; bottom: -1px; left: 20px; right: 20px; height: 1px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0.4; }
.sidebar-logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: 13px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; box-shadow: 0 6px 16px var(--primary-glow); transition: transform 0.3s var(--ease-bounce); }
.sidebar-logo:hover { transform: rotate(-8deg) scale(1.08); }
.sidebar-logo svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 1.8; }
.sidebar-title h2 { font-size: 16.5px; font-weight: 800; color: var(--dark); letter-spacing: -0.4px; }
.sidebar-title h2 span { background: linear-gradient(135deg, var(--primary), var(--primary-deep)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.sidebar-title p { font-size: 11px; color: var(--gray-2); font-weight: 600; letter-spacing: 0.3px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
.nav-section { margin-bottom: 20px; }
.nav-section-title { font-size: 10px; font-weight: 800; color: var(--gray-2); text-transform: uppercase; letter-spacing: 1.2px; padding: 0 12px 10px; display: flex; align-items: center; gap: 8px; }
.nav-section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px; color: var(--gray); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s var(--ease); margin-bottom: 3px; position: relative; overflow: hidden; user-select: none; }
.nav-item::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%) scaleY(0); width: 3px; height: 60%; background: var(--primary); border-radius: 0 4px 4px 0; transition: transform 0.25s var(--ease); }
.nav-item:hover { background: var(--primary-50); color: var(--primary-dark); transform: translateX(3px); }
.nav-item:hover::before { transform: translateY(-50%) scaleY(1); }
.nav-item.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; box-shadow: 0 8px 20px var(--primary-glow); transform: translateX(0); }
.nav-item.active::before { display: none; }
.nav-item .icon { width: 20px; height: 20px; transition: transform 0.3s var(--ease-bounce); }
.nav-item:hover .icon { transform: scale(1.15) rotate(-5deg); }
.nav-item .badge { margin-left: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px; min-width: 22px; text-align: center; animation: badgePulse 2s ease-in-out infinite; }
@keyframes badgePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
.nav-item.active .badge { background: rgba(255,255,255,0.3); animation: none; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.user-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: linear-gradient(135deg, var(--primary-50), white); border-radius: 12px; border: 1px solid var(--primary-light); transition: all 0.25s var(--ease); }
.user-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.user-avatar { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 14px; flex-shrink: 0; box-shadow: 0 4px 12px var(--primary-glow); overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { flex: 1; min-width: 0; }
.user-info h4 { font-size: 13px; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-info p { font-size: 11px; color: var(--gray); font-weight: 500; }
.user-actions { display: flex; gap: 4px; }
.account-btn { width: 30px; height: 30px; border: none; background: transparent; color: var(--gray); cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease); }
.account-btn:hover { background: var(--primary); color: white; transform: scale(1.05); }
.account-btn svg { width: 15px; height: 15px; }
.logout-btn { width: 34px; height: 34px; border: none; background: transparent; color: var(--gray); cursor: pointer; border-radius: 9px; display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease); }
.logout-btn:hover { background: var(--danger); color: white; transform: rotate(90deg); }
.logout-btn svg { width: 17px; height: 17px; }
.main { flex: 1; margin-left: 268px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: rgba(255,255,255,0.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 100; }
.menu-toggle { display: none; background: none; border: none; color: var(--dark); cursor: pointer; padding: 8px; border-radius: 9px; transition: all 0.2s; }
.menu-toggle:hover { background: var(--light); }
.menu-toggle svg { width: 22px; height: 22px; }
.topbar-title h1 { font-size: 20px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; transition: opacity 0.3s; }
.topbar-title p { font-size: 12px; color: var(--gray); margin-top: 2px; font-weight: 500; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search-box { position: relative; }
.search-box input { padding: 10px 16px 10px 42px; border: 2px solid var(--border); border-radius: 11px; font-size: 13px; font-family: inherit; width: 280px; outline: none; transition: all 0.25s var(--ease); background: rgba(248,250,252,0.8); font-weight: 500; }
.search-box input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px var(--primary-light); width: 320px; }
.search-box .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray-2); width: 17px; height: 17px; pointer-events: none; }
.icon-btn { width: 42px; height: 42px; border: none; background: var(--light); border-radius: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--gray); position: relative; transition: all 0.25s var(--ease); }
.icon-btn:hover { background: var(--primary-50); color: var(--primary); transform: translateY(-2px); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .dot { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; background: var(--danger); border-radius: 50%; border: 2px solid var(--white); animation: dotPulse 1.5s ease-in-out infinite; }
@keyframes dotPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 50% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
.content { padding: 28px; flex: 1; }
.page { display: none; }
.page.active { display: block; animation: pageIn 0.5s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; transition: all 0.3s var(--ease); }
.card:hover { box-shadow: var(--shadow); }
.card-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: linear-gradient(180deg, white, #fafcfb); }
.card-header h3 { font-size: 15px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 9px; letter-spacing: -0.2px; }
.card-header h3 .icon { color: var(--primary); }
.card-body { padding: 22px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-bottom: 24px; }
.stat-card { background: var(--white); border-radius: var(--radius); padding: 22px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: all 0.35s var(--ease); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--primary-deep)); transform: scaleX(0); transform-origin: left; transition: transform 0.4s var(--ease); }
.stat-card:hover::before { transform: scaleX(1); }
.stat-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); border-color: var(--primary-light); }
.stat-card.blue::before { background: linear-gradient(90deg, var(--info), #2563eb); }
.stat-card.blue .stat-icon { background: var(--info-light); color: #1e40af; }
.stat-card.orange::before { background: linear-gradient(90deg, var(--warning), #d97706); }
.stat-card.orange .stat-icon { background: var(--warning-light); color: #b45309; }
.stat-card.red::before { background: linear-gradient(90deg, var(--danger), #dc2626); }
.stat-card.red .stat-icon { background: var(--danger-light); color: #b91c1c; }
.stat-card.purple::before { background: linear-gradient(90deg, var(--purple), #7c3aed); }
.stat-card.purple .stat-icon { background: var(--purple-light); color: #6d28d9; }
.stat-icon { width: 48px; height: 48px; border-radius: 13px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; background: var(--primary-light); color: var(--primary-dark); transition: all 0.3s var(--ease-bounce); }
.stat-icon svg { width: 24px; height: 24px; }
.stat-card:hover .stat-icon { transform: scale(1.15) rotate(-8deg); }
.stat-label { font-size: 11.5px; color: var(--gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -0.8px; line-height: 1.1; }
.stat-change { font-size: 12px; margin-top: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.stat-change.up { color: var(--primary); }
.stat-change.down { color: var(--danger); }
.stat-change svg { width: 13px; height: 13px; }
.counter { display: inline-block; }
.quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 24px; }
.quick-action { display: flex; align-items: center; gap: 13px; padding: 16px 18px; background: var(--white); border: 2px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.3s var(--ease); color: var(--dark); font-weight: 600; font-size: 13.5px; }
.quick-action:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 12px 24px -8px var(--primary-glow); }
.qa-icon { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; box-shadow: 0 6px 14px var(--primary-glow); transition: transform 0.3s var(--ease-bounce); }
.qa-icon svg { width: 20px; height: 20px; }
.quick-action:hover .qa-icon { transform: scale(1.12) rotate(-8deg); }
.charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; margin-bottom: 24px; }
.chart-container { height: 290px; position: relative; }
.financial-box { background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #10b981 100%); color: white; padding: 28px; border-radius: var(--radius-lg); margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: 0 20px 40px -12px rgba(16,185,129,0.35); }
.financial-box h3 { font-size: 14px; font-weight: 700; opacity: 0.95; margin-bottom: 20px; position: relative; display: flex; align-items: center; gap: 8px; }
.financial-box h3 svg { width: 18px; height: 18px; }

/* ==================== DB ==================== */
const DB = {
    _cache: {},
    async loadAll() {
        const tables = ['subjects', 'teachers', 'groups', 'students', 'payments', 'expenses', 'attendance', 'schedules', 'notifications', 'salary_payments'];
        await Promise.all(tables.map(async (table) => {
            try {
                const { data, error } = await window.supabaseClient.from(table).select('*');
                if (error) { this._cache[table] = []; }
                else { this._cache[table] = data || []; }
            } catch (err) { this._cache[table] = []; }
        }));
        console.log('📊 Ma\'lumotlar yuklandi');
    },
    get(key) { return this._cache[key] || []; },
    async insert(table, data) {
        const { data: result, error } = await window.supabaseClient.from(table).insert(data).select().single();
        if (error) throw new Error(error.message);
        this._cache[table] = [...(this._cache[table] || []), result];
        return result;
    },
    async update(table, id, data) {
        const { data: result, error } = await window.supabaseClient.from(table).update(data).eq('id', id).select().single();
        if (error) throw new Error(error.message);
        const arr = this._cache[table] || [];
        const i = arr.findIndex(x => x.id === id);
        if (i >= 0) arr[i] = result;
        return result;
    },
    async remove(table, id) {
        const { error } = await window.supabaseClient.from(table).delete().eq('id', id);
        if (error) throw new Error(error.message);
        this._cache[table] = (this._cache[table] || []).filter(x => x.id !== id);
    }
};

/* ==================== HELPERS ==================== */
function togglePw() {

function formatMoney(n) { return new Intl.NumberFormat('uz-UZ').format(Math.round(n || 0)) + ' so\'m'; }
function formatMoneyPlain(n) { return new Intl.NumberFormat('uz-UZ').format(Math.round(n || 0)); }
function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('uz-UZ'); }
function formatMonth(monthStr) {
    if (!monthStr) return '-';
    const [y, m] = monthStr.split('-');
    const months = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
    return `${months[parseInt(m)-1]} ${y}`;
}
function getStudentName(id) { const s = DB.get('students').find(s => s.id === id); return s ? s.full_name : 'Noma\'lum'; }
function getGroupName(id) { const g = DB.get('groups').find(g => g.id === id); return g ? g.name : '-'; }
function getSubjectName(id) { const s = DB.get('subjects').find(s => s.id === id); return s ? s.name : '-'; }
function getTeacherName(id) { const t = DB.get('teachers').find(t => t.id === id); return t ? t.full_name : '-'; }

function getAttendancePercent(studentId) {
    const att = DB.get('attendance').filter(a => a.student_id === studentId);
    if (!att.length) return 100;
    return Math.round((att.filter(a => a.status === 'Keldi' || a.status === 'Kechikdi').length / att.length) * 100);
}

function getMonthsBetween(startMonth, endMonth) {
    const months = [];
    let [y, m] = startMonth.split('-').map(Number);
    const [ey, em] = endMonth.split('-').map(Number);
    while (y < ey || (y === ey && m <= em)) {
        months.push(`${y}-${String(m).padStart(2, '0')}`);
        m++;
        if (m > 12) { m = 1; y++; }
    }
    return months;
}

function getStudentDebt(studentId) {
    const student = DB.get('students').find(s => s.id === studentId);
    if (!student) return 0;
    const monthlyPayment = parseFloat(student.monthly_payment) || 0;
    if (monthlyPayment === 0) return 0;
    let startDate = student.course_start_date;
    if (!startDate && student.created_at) startDate = student.created_at.slice(0, 10);
    if (!startDate) startDate = new Date().toISOString().split('T')[0];
    const startMonth = startDate.slice(0, 7);
    const currentMonth = new Date().toISOString().slice(0, 7);
    const months = getMonthsBetween(startMonth, currentMonth);
    const payments = DB.get('payments').filter(p => p.student_id === studentId);
    let totalDebt = 0;
    months.forEach(month => {
        const payment = payments.find(p => p.month === month);
        const paid = payment ? parseFloat(payment.paid_amount) || 0 : 0;
        const debt = monthlyPayment - paid;
        if (debt > 0) totalDebt += debt;
    });
    return totalDebt;
}

function getDebtMonths(studentId) {
    const student = DB.get('students').find(s => s.id === studentId);
    if (!student) return [];
    const monthlyPayment = parseFloat(student.monthly_payment) || 0;
    if (monthlyPayment === 0) return [];

    if (!startDate && student.created_at) startDate = student.created_at.slice(0, 10);

    const startMonth = startDate.slice(0, 7);
    const currentMonth = new Date().toISOString().slice(0, 7);
    const months = getMonthsBetween(startMonth, currentMonth);
    const payments = DB.get('payments').filter(p => p.student_id === studentId);
    const result = [];
    months.forEach(month => {
        const payment = payments.find(p => p.month === month);
        const paid = payment ? parseFloat(payment.paid_amount) || 0 : 0;
        if (monthlyPayment - paid > 0) result.push(formatMonth(month));
    });
    return result;
}

function getMonthsDetails(studentId) {

function animateCounter(el, target, duration = 1200) {
    const startTime = performance.now();
    const isMoney = target >= 100000;
    function tick(now) {
        const p = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = Math.floor(target * eased);
        el.textContent = isMoney ? formatMoney(val) : val.toLocaleString('uz-UZ');
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = isMoney ? formatMoney(target) : target.toLocaleString('uz-UZ');
    }
    requestAnimationFrame(tick);
}

/* ==================== TEACHER SALARY ==================== */
function calculateTeacherSalary(teacherId, month = null) {
    const teacher = DB.get('teachers').find(t => t.id === teacherId);
    if (!teacher) return { total: 0, details: [], type: 'unknown' };
    const teacherGroups = DB.get('groups').filter(g => g.teacher_id === teacherId);
    if (!teacherGroups.length) return { total: 0, details: [], type: teacher.salary_type };
    const groupIds = teacherGroups.map(g => g.id);
    const students = DB.get('students').filter(s => groupIds.includes(s.group_id));
    const studentIds = students.map(s => s.id);
    let payments = DB.get('payments').filter(p => studentIds.includes(p.student_id));
    if (month) payments = payments.filter(p => p.month === month);
    if (teacher.salary_type === 'percentage') {
        const percentage = parseFloat(teacher.salary_percentage) || 0;
        const details = [];
        let total = 0;
        payments.forEach(p => {
            const paidAmount = parseFloat(p.paid_amount) || 0;
            if (paidAmount <= 0) return;
            const share = paidAmount * (percentage / 100);
            total += share;
            details.push({
                student_id: p.student_id, student_name: getStudentName(p.student_id),
                month: p.month, paid: paidAmount, share: share
            });
        });
        details.sort((a, b) => (b.month || '').localeCompare(a.month || ''));
        return { total, details, type: 'percentage', percentage };
    } else if (teacher.salary_type === 'fixed') {
        return { total: parseFloat(teacher.salary_amount) || 0, details: [], type: 'fixed' };
    } else if (teacher.salary_type === 'per_lesson') {
        const schedules = DB.get('schedules').filter(s => s.teacher_id === teacherId);
        const perLesson = parseFloat(teacher.salary_amount) || 0;
        return { total: schedules.length * perLesson, details: schedules, type: 'per_lesson', perLesson };
    }
    return { total: 0, details: [], type: 'unknown' };
}

function getAvailableSalaryMonths() {
    const payments = DB.get('payments');
    const monthSet = new Set();
    payments.forEach(p => { if (p.month) monthSet.add(p.month); });
    monthSet.add(new Date().toISOString().slice(0, 7));
    const now = new Date();
    for (let i = 1; i <= 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        monthSet.add(d.toISOString().slice(0, 7));
    }
    return [...monthSet].sort().reverse();
}

/* ==================== TEACHER SALARY PAYMENTS ==================== */
function getTeacherSalaryPayment(teacherId, month) {
    return DB.get('salary_payments').find(sp => sp.teacher_id === teacherId && sp.month === month);
}

function getTeacherSalaryPaymentStatus(teacherId, month) {
    const payment = getTeacherSalaryPayment(teacherId, month);
    const salary = calculateTeacherSalary(teacherId, month);
    const expected = salary.total;
    const paid = payment ? parseFloat(payment.paid_amount) || 0 : 0;
    if (expected === 0) return { status: 'none', expected: 0, paid: 0, debt: 0 };
    if (paid >= expected) return { status: 'paid', expected, paid, debt: 0 };
    if (paid > 0) return { status: 'partial', expected, paid, debt: expected - paid };
    return { status: 'unpaid', expected, paid: 0, debt: expected };
}

function getTeacherTotalDebt(teacherId) {
    const currentMonth = new Date().toISOString().slice(0, 7);
    const months = getAvailableSalaryMonths().filter(m => m < currentMonth);
    let totalDebt = 0;
    months.forEach(m => {
        const st = getTeacherSalaryPaymentStatus(teacherId, m);
        if (st.status === 'unpaid' || st.status === 'partial') {
            totalDebt += st.debt;
        }
    });
    return totalDebt;
}

function formatSalaryStatus(status) {
    const map = {
        'paid': { label: 'To\'langan', cls: 'badge-success' },
        'partial': { label: 'Qisman', cls: 'badge-warning' },
        'unpaid': { label: 'To\'lanmagan', cls: 'badge-danger' },
        'none': { label: 'Hisoblanmagan', cls: 'badge-gray' }
    };
    return map[status] || map.none;
}

async function uploadPhotoToStorage(blob) {
    const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.jpg`;
    const { error } = await window.supabaseClient.storage.from('photos').upload(fileName, blob);
    if (error) return null;
    const { data: { publicUrl } } = window.supabaseClient.storage.from('photos').getPublicUrl(fileName);
    return publicUrl;
}
function cropTo3x4(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 300; canvas.height = 400;
                const ctx = canvas.getContext('2d');
                const targetAspect = 300 / 400;
                const srcAspect = img.width / img.height;
                let sx = 0, sy = 0, sw = img.width, sh = img.height;
                if (srcAspect > targetAspect) { sw = img.height * targetAspect; sx = (img.width - sw) / 2; }
                else { sh = img.width / targetAspect; sy = (img.height - sh) / 2; }
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 300, 400);
                canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}
function attachPhotoListener() {
    const inp = document.getElementById('photoInput');
    if (!inp) return;
    inp.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) { toast('Xatolik', 'Rasm 2MB dan kichik bo\'lishi kerak', 'error'); return; }
        try {
            const blob = await cropTo3x4(file);
            toast('Yuklanmoqda...', 'Rasm saqlanmoqda', 'info');
            const publicUrl = await uploadPhotoToStorage(blob);
            if (!publicUrl) { toast('Xatolik', 'Rasm yuklanmadi', 'error'); return; }
            _pendingPhoto = publicUrl;
            const box = document.getElementById('photoPreviewBox');
            box.innerHTML = `<img src="${publicUrl}" alt="Rasm">`;
            const rm = document.getElementById('removePhotoBtn');
            if (rm) rm.style.display = 'inline-flex';
            toast('Muvaffaqiyat', 'Rasm yuklandi');
        } catch (err) { toast('Xatolik', 'Rasmni yuklab bo\'lmadi', 'error'); }
    });
}
function removePhoto() {

function buildDaysScheduleHTML(existingDays) {
    const days = existingDays || [];
    return `<div class="days-grid">${DAYS.map(day => {
        const existing = days.find(d => d.day === day);
        const isActive = !!existing;
        const start = existing?.start || '09:00';
        const end = existing?.end || '10:30';
        return `<div class="day-row ${isActive ? 'active' : ''}" data-day="${day}">
            <label class="day-check"><input type="checkbox" class="day-checkbox" data-day="${day}" ${isActive ? 'checked' : ''}><span>${day}</span></label>
            <div class="day-times">
                <input type="time" class="day-start" data-day="${day}" value="${start}" ${isActive ? '' : 'disabled'}>
                <span class="dash">—</span>
                <input type="time" class="day-end" data-day="${day}" value="${end}" ${isActive ? '' : 'disabled'}>
            </div>
        </div>`;
    }).join('')}</div>`;
}
function attachDaysListeners() {
    document.querySelectorAll('.day-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            const day = cb.dataset.day;
            const row = document.querySelector(`.day-row[data-day="${day}"]`);
            const start = row.querySelector('.day-start');
            const end = row.querySelector('.day-end');
            if (cb.checked) { row.classList.add('active'); start.disabled = false; end.disabled = false; }
            else { row.classList.remove('active'); start.disabled = true; end.disabled = true; }
        });
    });
}
function collectDaysFromForm() {
    const result = [];
    document.querySelectorAll('.day-row').forEach(row => {
        const day = row.dataset.day;
        const cb = row.querySelector('.day-checkbox');
        if (cb && cb.checked) {
            const start = row.querySelector('.day-start').value || '09:00';
            const end = row.querySelector('.day-end').value || '10:30';
            if (start < end) result.push({ day, start, end });
        }
    });
    return result;
}

document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const txt = document.getElementById('loginBtnText');
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    btn.disabled = true;
    txt.innerHTML = '<span class="loader"></span>';

    const email = u.includes('@') ? u : `${u}@bloom.uz`;
    try {
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password: p });
        if (!error && data.user) {
            let { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
            if (!profile) {
                const { data: np } = await window.supabaseClient.from('profiles').insert({ id: data.user.id, username: u, full_name: u, role: 'admin' }).select().single();
                profile = np;
            }
            currentUser = { ...profile, role: 'admin' };
            await DB.loadAll();
            loginSuccess();
            return;
        }
    } catch (err) { }

    try {
        const { data: teacher, error: tErr } = await window.supabaseClient
            .from('teachers').select('*').eq('login', u).eq('password', p).single();
        if (tErr || !teacher) {
            btn.disabled = false;
            txt.textContent = 'Kirish';
            document.getElementById('loginBox').classList.add('shake');
            setTimeout(() => document.getElementById('loginBox').classList.remove('shake'), 500);
            toast('Xatolik', 'Login yoki parol noto\'g\'ri', 'error');
            return;
        }
        currentUser = { id: teacher.id, full_name: teacher.full_name, role: 'teacher', teacher_id: teacher.id, photo: teacher.photo, login: teacher.login };
        await DB.loadAll();
        loginSuccess();
    } catch (err) {
        btn.disabled = false;
        txt.textContent = 'Kirish';
        toast('Xatolik', 'Server xatoligi', 'error');
    }
});

function navigate(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const pageEl = document.getElementById('page-' + page);
    if (pageEl) pageEl.classList.add('active');
    const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
    if (navEl) navEl.classList.add('active');
    const [title, subtitle] = pageTitles[page] || ['Sahifa', ''];
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSubtitle').textContent = subtitle;
    if (window.innerWidth <= 768) closeSidebar();
    const renderMap = {
        dashboard: renderDashboard, students: renderStudents, teachers: renderTeachers,
        groups: renderGroups, subjects: renderSubjects, payments: renderPayments,
        expenses: renderExpenses, salaries: renderSalaries, schedule: renderSchedule,
        attendance: renderAttendance, reports: renderReports, notifications: renderNotifications
    };
    if (renderMap[page]) renderMap[page]();
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
}

function renderDashboard() {
    const students = DB.get('students');
    const teachers = DB.get('teachers');
    const groups = DB.get('groups');
    const subjects = DB.get('subjects');
    const payments = DB.get('payments');
    const expenses = DB.get('expenses');
    const schedules = DB.get('schedules');

    const activeStudents = students.filter(s => s.status === 'Faol').length;
    const totalDebt = students.reduce((s, st) => s + getStudentDebt(st.id), 0);
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthPayments = payments.filter(p => p.month === thisMonth);
    const monthExpected = monthPayments.reduce((s, p) => s + parseFloat(p.expected_amount || 0), 0);
    const monthReceived = monthPayments.reduce((s, p) => s + parseFloat(p.paid_amount || 0), 0);
    const monthExpenses = expenses.filter(e => (e.date || '').slice(0, 7) === thisMonth).reduce((s, e) => s + parseFloat(e.amount || 0), 0);
    const debtors = students.filter(s => getStudentDebt(s.id) > 0);
    
    let totalTeacherSalaries = 0;
    let totalPaidSalaries = 0;
    let totalSalaryDebt = 0;
    teachers.forEach(t => {
        if (t.status === 'Faol') {
            const sal = calculateTeacherSalary(t.id, thisMonth);
            totalTeacherSalaries += sal.total;
            const st = getTeacherSalaryPaymentStatus(t.id, thisMonth);
            totalPaidSalaries += st.paid;
            totalSalaryDebt += st.debt;
        }
    });

    const today = DAYS_MAP[new Date().getDay()];
    const todaySchedules = schedules
        .filter(s => s.day && s.day.trim().toLowerCase() === today.toLowerCase())
        .sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));

    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-icon"><svg><use href="#i-user-grad"/></svg></div><div class="stat-label">Jami o'quvchilar</div><div class="stat-value counter" data-target="${students.length}">0</div><div class="stat-change up"><svg><use href="#i-trending-up"/></svg> Faol: ${activeStudents}</div></div>
        <div class="stat-card blue"><div class="stat-icon"><svg><use href="#i-user-teacher"/></svg></div><div class="stat-label">O'qituvchilar</div><div class="stat-value counter" data-target="${teachers.length}">0</div></div>
        <div class="stat-card purple"><div class="stat-icon"><svg><use href="#i-users"/></svg></div><div class="stat-label">Guruhlar</div><div class="stat-value counter" data-target="${groups.length}">0</div><div class="stat-change up">Fanlar: ${subjects.length}</div></div>
        <div class="stat-card orange"><div class="stat-icon"><svg><use href="#i-dollar"/></svg></div><div class="stat-label">Bu oy kutilgan</div><div class="stat-value counter" data-target="${monthExpected}">0</div></div>
        <div class="stat-card"><div class="stat-icon"><svg><use href="#i-check-circle"/></svg></div><div class="stat-label">Bu oy tushgan</div><div class="stat-value counter" data-target="${monthReceived}">0</div></div>
        <div class="stat-card red"><div class="stat-icon"><svg><use href="#i-wallet"/></svg></div><div class="stat-label">Bu oy xarajat</div><div class="stat-value counter" data-target="${monthExpenses}">0</div></div>
        <div class="stat-card red"><div class="stat-icon"><svg><use href="#i-alert"/></svg></div><div class="stat-label">Jami qarz</div><div class="stat-value counter" data-target="${totalDebt}">0</div><div class="stat-change down">${debtors.length} qarzdor</div></div>
        <div class="stat-card blue"><div class="stat-icon"><svg><use href="#i-calendar"/></svg></div><div class="stat-label">Bugun (${today})</div><div class="stat-value counter" data-target="${todaySchedules.length}">0</div></div>
    `;
    document.querySelectorAll('.counter').forEach(el => animateCounter(el, parseInt(el.dataset.target) || 0));

    const totalMonthly = students.reduce((s, st) => s + parseFloat(st.monthly_payment || 0), 0);
    document.getElementById('financialSummary').innerHTML = `
        <div class="financial-item"><label>Jami o'quvchilar</label><div class="value">${students.length} ta</div></div>
        <div class="financial-item"><label>O'rtacha oylik</label><div class="value">${formatMoney(totalMonthly / (students.length || 1))}</div></div>
        <div class="financial-item total"><label>Kutilayotgan oylik</label><div class="value">${formatMoney(totalMonthly)}</div></div>
        <div class="financial-item"><label>Bu oy tushgan</label><div class="value">${formatMoney(monthReceived)}</div></div>
        <div class="financial-item"><label>O'qituvchilar maoshi (hisob.)</label><div class="value">${formatMoney(totalTeacherSalaries)}</div></div>
        <div class="financial-item"><label>To'langan maosh</label><div class="value">${formatMoney(totalPaidSalaries)}</div></div>
        <div class="financial-item"><label>Maosh qarzi</label><div class="value" style="color: #fca5a5;">${formatMoney(totalSalaryDebt)}</div></div>
        <div class="financial-item total"><label>Umumiy qarz</label><div class="value" style="color: #fca5a5;">${formatMoney(totalDebt)}</div></div>
    `;

        todayEl.innerHTML = `<div class="empty-state" style="padding:30px;"><div class="icon-wrap" style="width:60px;height:60px;"><svg style="width:28px;height:28px;"><use href="#i-calendar"/></svg></div><h3>Bugun (${today}) dars yo'q</h3></div>`;
    } else {
        todayEl.innerHTML = todaySchedules.map(s => `
            <div class="schedule-item">
                <div class="schedule-time">${s.start_time}<small>${s.end_time}</small></div>
                <div class="schedule-info">
                    <h4>${getSubjectName(s.subject_id)}</h4>

                </div>
            </div>
        `).join('');
    }

    const debtorsEl = document.getElementById('debtorsList');
    if (!debtors.length) {
        debtorsEl.innerHTML = `<div class="empty-state" style="padding:30px;"><div class="icon-wrap" style="width:60px;height:60px;"><svg style="width:28px;height:28px;"><use href="#i-check-circle"/></svg></div><h3>Qarzdorlar yo'q</h3></div>`;
    } else {
        const sortedDebtors = [...debtors].sort((a, b) => getStudentDebt(b.id) - getStudentDebt(a.id));
        debtorsEl.innerHTML = sortedDebtors.slice(0, 8).map(s => {
            const debt = getStudentDebt(s.id);
            const months = getDebtMonths(s.id);

                <div class="schedule-item" style="border-left-color: var(--danger); cursor: pointer; position: relative; transition: all 0.25s var(--ease);" 
                     onclick="openManualPaymentModal(${s.id})"
                     onmouseover="this.style.background='#fef2f2'; this.style.transform='translateX(6px)'; this.style.boxShadow='0 8px 20px -8px rgba(239,68,68,0.4)'"
                     onmouseout="this.style.background=''; this.style.transform=''; this.style.boxShadow=''">
                    <div class="schedule-time" style="color: var(--danger); font-size: 11px; background: #fef2f2; min-width: 90px;">
                        ${formatMoney(debt)}
                        <small style="color: #991b1b;">Qarz</small>

    renderCharts(students, payments, groups, expenses);

function renderCharts(students, payments, groups, expenses) {
    destroyCharts();
    const commonOpts = {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11, weight: '600' }, padding: 14, usePointStyle: true, pointStyle: 'circle' } } }
    };
    const activeCount = students.filter(s => s.status === 'Faol').length;
    charts.students = new Chart(document.getElementById('chartStudents'), {
        type: 'doughnut',
        data: { labels: ['Faol', 'Nofaol'], datasets: [{ data: [activeCount, students.length - activeCount], backgroundColor: ['#10b981', '#e2e8f0'], borderWidth: 0, cutout: '72%' }] },
        options: commonOpts
    });
    const months = {};
    payments.forEach(p => { if (!months[p.month]) months[p.month] = 0; months[p.month] += parseFloat(p.paid_amount || 0); });
    const sortedMonths = Object.keys(months).sort().slice(-6);
    charts.revenue = new Chart(document.getElementById('chartRevenue'), {
        type: 'line',
        data: { labels: sortedMonths.length ? sortedMonths.map(m => formatMonth(m)) : ['Ma\'lumot yo\'q'], datasets: [{ label: 'Daromad', data: sortedMonths.length ? sortedMonths.map(m => months[m]) : [0], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.12)', fill: true, tension: 0.4, borderWidth: 3, pointBackgroundColor: '#10b981', pointRadius: 5 }] },
        options: { ...commonOpts, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });
    const statusCounts = { 'To\'langan': 0, 'Qisman to\'langan': 0, 'To\'lanmagan': 0 };
    payments.forEach(p => { if (statusCounts[p.status] !== undefined) statusCounts[p.status]++; });
    charts.payments = new Chart(document.getElementById('chartPayments'), {
        type: 'bar',
        data: { labels: ['To\'langan', 'Qisman', 'To\'lanmagan'], datasets: [{ data: [statusCounts['To\'langan'], statusCounts['Qisman to\'langan'], statusCounts['To\'lanmagan']], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderRadius: 10, borderWidth: 0, barThickness: 50 }] },
        options: { ...commonOpts, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });
    const expByCat = {};
    EXPENSE_CATEGORIES.forEach(c => expByCat[c] = 0);
    expenses.forEach(e => { const cat = e.category || 'Boshqa'; expByCat[cat] = (expByCat[cat] || 0) + parseFloat(e.amount || 0); });
    const catLabels = Object.keys(expByCat).filter(k => expByCat[k] > 0);
    const catColors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4'];
    charts.expenses = new Chart(document.getElementById('chartExpenses'), {
        type: 'doughnut',
        data: { labels: catLabels.length ? catLabels : ['Xarajat yo\'q'], datasets: [{ data: catLabels.length ? catLabels.map(k => expByCat[k]) : [1], backgroundColor: catLabels.length ? catLabels.map((_, i) => catColors[i % catColors.length]) : ['#e2e8f0'], borderWidth: 0, cutout: '65%' }] },
        options: commonOpts
    });
    const groupCounts = groups.map(g => ({ name: g.name, count: students.filter(s => s.group_id === g.id).length }));
    charts.groups = new Chart(document.getElementById('chartGroups'), {
        type: 'bar',
        data: { labels: groupCounts.length ? groupCounts.map(g => g.name) : ['Ma\'lumot yo\'q'], datasets: [{ label: 'O\'quvchilar', data: groupCounts.length ? groupCounts.map(g => g.count) : [0], backgroundColor: 'rgba(16,185,129,0.85)', borderRadius: 10, barThickness: 45 }] },
        options: { ...commonOpts, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });
}

                </div>

        selectedCards.forEach(card => {

            const input = card.querySelector('.pm-amount-input');

            if (amount > 0) payments.push({ month, amount });

        if (!payments.length) { toast('Xatolik', 'Kamida bitta oy uchun summa kiriting', 'error'); return; }
        const paymentDate = document.getElementById('mp_date').value;
        const paymentMethod = document.getElementById('mp_method').value;
        const notes = document.getElementById('mp_notes').value || null;
        try {
            for (const item of payments) {
                const existing = DB.get('payments').find(p => p.student_id === studentId && p.month === item.month);
                if (existing) {
                    const newPaid = (parseFloat(existing.paid_amount) || 0) + item.amount;
                    const expected = parseFloat(existing.expected_amount) || monthlyPayment;
                    const status = newPaid >= expected ? 'To\'langan' : newPaid > 0 ? 'Qisman to\'langan' : 'To\'lanmagan';
                    await DB.update('payments', existing.id, {
                        paid_amount: newPaid, payment_date: paymentDate,
                        payment_method: paymentMethod, status, notes
                    });
                } else {
                    const status = item.amount >= monthlyPayment ? 'To\'langan' : 'Qisman to\'langan';

                        student_id: studentId, month: item.month,
                        expected_amount: monthlyPayment, paid_amount: item.amount,
                        payment_date: paymentDate, payment_method: paymentMethod,
                        status, notes
                    });
                }
            }
            const totalAmount = payments.reduce((s, p) => s + p.amount, 0);
            toast('Muvaffaqiyat', `${formatMoney(totalAmount)} qabul qilindi (${payments.length} oy) ✅`);

        `<svg class="icon" style="color:var(--warning)"><use href="#i-credit-card"/></svg> Qo'lda to'lov qabul qilish`,
        body,
        `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
         <button class="btn btn-primary" onclick="saveModal()"><svg class="icon-sm"><use href="#i-check-circle"/></svg> To'lovni tasdiqlash</button>`
    );
    setTimeout(updateManualTotal, 50);
}

function togglePayMonth(month) {
    const card = document.getElementById('pmc-' + month);
    if (!card) return;
    const checkbox = card.querySelector('.pm-checkbox');
    checkbox.checked = !checkbox.checked;
    if (checkbox.checked) card.classList.add('checked');
    else card.classList.remove('checked');
    updateManualTotal();
}
function setPayAmount(month, amount) {
    const card = document.getElementById('pmc-' + month);
    if (!card) return;
    const input = card.querySelector('.pm-amount-input');
    input.value = amount;
    updateManualTotal();
}
function fillAllFull() {
    document.querySelectorAll('.pay-month-card').forEach(card => {
        const checkbox = card.querySelector('.pm-checkbox');
        const input = card.querySelector('.pm-amount-input');
        const debt = parseFloat(card.dataset.debt) || 0;
        checkbox.checked = true;
        card.classList.add('checked');
        input.value = debt;
    });
    updateManualTotal();
}
function fillAllHalf() {
    document.querySelectorAll('.pay-month-card').forEach(card => {
        const checkbox = card.querySelector('.pm-checkbox');
        const input = card.querySelector('.pm-amount-input');
        const debt = parseFloat(card.dataset.debt) || 0;
        checkbox.checked = true;
        card.classList.add('checked');
        input.value = Math.floor(debt / 2);
    });
    updateManualTotal();
}
function clearAllAmounts() {
    document.querySelectorAll('.pay-month-card').forEach(card => {
        const checkbox = card.querySelector('.pm-checkbox');
        const input = card.querySelector('.pm-amount-input');
        checkbox.checked = false;
        card.classList.remove('checked');
        input.value = 0;
    });
    updateManualTotal();
}
function updateManualTotal() {
    let total = 0, count = 0;
    document.querySelectorAll('.pay-month-card').forEach(card => {
        const month = card.dataset.month;
        const checkbox = card.querySelector('.pm-checkbox');
        const input = card.querySelector('.pm-amount-input');
        const debt = parseFloat(card.dataset.debt) || 0;
        const amount = parseFloat(input.value) || 0;
        const remain = Math.max(0, debt - amount);
        const remainEl = document.getElementById('remain-' + month);
        if (remainEl) {
            remainEl.textContent = remain > 0 ? formatMoney(remain) : '0 so\'m';
            remainEl.style.color = remain > 0 ? 'var(--danger)' : 'var(--primary-dark)';
        }
        if (amount > 0) {
            card.classList.add('checked');
            checkbox.checked = true;
            if (amount < debt) card.classList.add('partial');
            else card.classList.remove('partial');
            total += amount;
            count++;
        } else {
            checkbox.checked = false;
            card.classList.remove('checked');
            card.classList.remove('partial');
        }
    });
    const totalEl = document.getElementById('manualPayTotal');
    const countEl = document.getElementById('manualPayCount');
    if (totalEl) totalEl.textContent = formatMoney(total);
    if (countEl) countEl.textContent = count + ' oy';
}

function viewTeacherSalary(teacherId, initialMonth = null) {

    if (!teacher) return;
    const months = getAvailableSalaryMonths();
    const selectedMonth = initialMonth || _selectedSalaryMonth || new Date().toISOString().slice(0, 7);
    
    const monthOptions = months.map(m => `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${formatMonth(m)}</option>`).join('');
    
    const body = `
        <div style="display:flex; gap:16px; align-items:center; padding:16px; background:linear-gradient(135deg, var(--info-light), white); border-radius:14px; margin-bottom:20px; border:1px solid var(--info);">
            ${teacher.photo ? `<div class="profile-avatar" style="width:70px;height:70px;border-radius:18px;"><img src="${teacher.photo}"></div>` : `<div class="profile-avatar" style="width:70px;height:70px;border-radius:18px;font-size:28px;">${teacher.full_name.charAt(0)}</div>`}
            <div style="flex:1;">
                <h3 style="font-size:18px; font-weight:800; color:var(--dark); margin-bottom:4px;">${teacher.full_name}</h3>
                <p style="font-size:13px; color:var(--gray); margin-bottom:6px;">${getSubjectName(teacher.subject_id)} • ${teacher.phone || '-'}</p>
                <span class="badge ${teacher.salary_type === 'percentage' ? 'badge-purple' : teacher.salary_type === 'per_lesson' ? 'badge-warning' : 'badge-info'}">
                    ${teacher.salary_type === 'percentage' ? `Foizli: ${teacher.salary_percentage}%` : teacher.salary_type === 'per_lesson' ? `Dars uchun: ${formatMoney(teacher.salary_amount)}` : `Belgilangan: ${formatMoney(teacher.salary_amount)}`}
                </span>
            </div>
        </div>
        
        <div style="background: var(--light); border: 2px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;">
            <label style="display:block; font-size: 12px; font-weight: 800; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">📅 Oyni tanlang</label>

    `;
    
    openModal(`<svg class="icon"><use href="#i-percent"/></svg> O'qituvchi maoshi`, body, `<button class="btn btn-secondary" onclick="closeModal()">Yopish</button>`);
    
    setTimeout(() => renderTeacherSalaryContent(teacherId, selectedMonth), 50);
}
